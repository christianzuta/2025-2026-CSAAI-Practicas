<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot League</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="ui-layer">
            
            <div id="menu-screen" class="screen">
                <h1>BOT LEAGUE</h1>
                <p>Elige tu modo de juego:</p>
                <button id="btn-3goals">Partido a 3 Goles</button>
                <button id="btn-golden">Gol de Oro</button>
            </div>

            <div id="hud" class="hidden">
                <span id="score-player">0</span> - <span id="score-enemy">0</span>
            </div>

            <div id="message-screen" class="screen hidden">
                <h2 id="main-message">3</h2>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <h1 id="end-title">¡Ganaste!</h1>
                <button id="btn-restart">Volver al Menú</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
