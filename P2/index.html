<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOM - Juego de Descifrado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>B O O M</h1>
    </header>

    <main class="game-container">
        <section class="display-panel">
            <div class="secret-code" id="secret-code-display">
                <div class="digit-box" id="box-0">*</div>
                <div class="digit-box" id="box-1">*</div>
                <div class="digit-box" id="box-2">*</div>
                <div class="digit-box" id="box-3">*</div>
            </div>
            
            <div class="timer" id="timer">0:00:00</div>
            
            <div class="attempts-info">
                Intentos restantes: <span id="attempts-count">7</span>
            </div>
            
            <div class="message-area" id="message">
                Nueva partida preparada. Pulsa Start o un número para comenzar.
            </div>
        </section>

        <section class="control-panel">
            <div class="numpad">
                <button class="num-btn" data-num="7">7</button>
                <button class="num-btn" data-num="8">8</button>
                <button class="num-btn" data-num="9">9</button>
                <button class="num-btn" data-num="4">4</button>
                <button class="num-btn" data-num="5">5</button>
                <button class="num-btn" data-num="6">6</button>
                <button class="num-btn" data-num="1">1</button>
                <button class="num-btn" data-num="2">2</button>
                <button class="num-btn" data-num="3">3</button>
                <div class="empty-space"></div>
                <button class="num-btn" data-num="0">0</button>
                <div class="empty-space"></div>
            </div>

            <div class="action-buttons">
                <button id="btn-start" class="action-btn">Start</button>
                <button id="btn-stop" class="action-btn">Stop</button>
                <button id="btn-reset" class="action-btn">Reset</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
